[project]
name = "agent-framework-voyageai"
description = "Voyage AI integration for Microsoft Agent Framework."
authors = [{ name = "Microsoft", email = "af-support@microsoft.com" }]
readme = "README.md"
requires-python = ">=3.11"
version = "1.0.0a261113"
license-files = ["LICENSE"]
urls.homepage = "https://aka.ms/agent-framework"
urls.source = "https://github.com/microsoft/agent-framework/tree/main/python"
urls.issues = "https://github.com/microsoft/agent-framework/issues"
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Typing :: Typed",
]
dependencies = [
    "agent-framework-core>=1.26.0,<2",
    "voyageai>=0.6.0,<0.7",
]

[tool.ruff]
extend = "../../pyproject.toml"

[tool.ruff.lint.per-file-ignores]
"samples/**" = ["D", "INP", "TD", "ERA001", "RUF", "S", "T201", "CPY"]
"tests/**" = ["D", "INP", "TD", "ERA001", "RUF", "S"]

[tool.pyright]
extends = "../../pyproject.toml"
include = ["agent_framework_voyageai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q -r fEX"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: marks tests as integration tests that require external services",
    "flaky: marks tests as flaky and eligible for automatic retry",
]
timeout = 60

[tool.coverage.run]
omit = ["**/__init__.py"]

[tool.poe]
executor.type = "uv"
include = "../../shared_tasks.toml"

[tool.poe.tasks.test]
help = "Run Voyage AI connector unit tests."
cmd = 'pytest -m "not integration" --cov=agent_framework_voyageai --cov-report=term-missing:skip-covered tests'

[tool.poe.tasks.test-integration]
help = "Run tests against the Voyage AI service using VOYAGE_API_KEY."
cmd = 'pytest -m integration tests'

[build-system]
requires = ["flit-core>=3.11,<5.0"]
build-backend = "flit_core.buildapi"
